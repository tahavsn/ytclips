[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "shorts-maker"
version = "0.1.0"
description = "Wandelt YouTube-Videos automatisch in vertikale Short-Clips (9:16) mit eingebrannten deutschen Untertiteln um."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "shorts-maker contributors" }]
keywords = ["youtube", "shorts", "tiktok", "reels", "whisper", "subtitles", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "anthropic>=1.15",
    "faster-whisper>=1.1",
    "yt-dlp>=2025.1.1",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
face = [
    "mediapipe>=0.10.14",
    "opencv-contrib-python>=4.9",
    "numpy>=1.26",
]
dev = [
    "pytest>=8",
]

[project.scripts]
shorts-maker = "shorts_maker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts_maker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
